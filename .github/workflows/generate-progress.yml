name: Generate Progress Graphs

on:
  push:
    paths:
      - 'out/progress_data.json'

permissions:
  contents: write 

jobs:
  generate-graphs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib

      - name: Run graph generator
        run: |
          python scripts/generate_progress_graph.py --data-file out/progress_data.json --output-dir out/

      - name: Commit and push generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out/*.png
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Update progress graphs [skip ci]"
            git push
          fi